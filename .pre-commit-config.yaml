# Pre-commit hooks for blueclaw.
#
# Install once per clone:
#     pip install pre-commit && pre-commit install
#
# Hooks then run automatically on `git commit`. To run manually across the
# whole tree (e.g., after pulling): `pre-commit run --all-files`.
#
# These mirror the `flake8` and `black --check` steps that CI runs, so a
# clean commit locally means CI will accept the same formatting. pytest is
# intentionally NOT included — it's slow enough to discourage commits;
# CI runs the full suite on every push.

repos:
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3
        args: ["--line-length=88", "--target-version=py311"]
        files: ^(blueclaw|tests)/.*\.py$

  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        args: ["--max-line-length=88"]
        files: ^(blueclaw|tests)/.*\.py$
