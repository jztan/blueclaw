# Pre-commit hooks for blueclaw.
#
# Install once per clone:
#     pip install pre-commit
#     pre-commit install                       # commit hooks: black, flake8
#     pre-commit install --hook-type pre-push  # push hook: pytest
#
# Commit hooks run on `git commit` and mirror the `flake8` / `black --check`
# steps in CI — a clean local commit means CI will accept the same formatting.
#
# The pytest hook runs on `git push` only (not every commit). It catches
# regressions before they reach CI without adding friction to small/WIP
# commits. Activate the project venv before pushing so the hook finds the
# project's pytest:
#     source .venv/bin/activate
#
# Manual whole-tree run: `pre-commit run --all-files`.
# Manual push-stage run: `pre-commit run --hook-stage pre-push --all-files`.
# Bypass for an emergency push: `git push --no-verify` (use sparingly).

repos:
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3
        args: ["--line-length=88", "--target-version=py311"]
        files: ^(blueclaw|tests)/.*\.py$

  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        args: ["--max-line-length=88"]
        files: ^(blueclaw|tests)/.*\.py$

  - repo: local
    hooks:
      - id: pytest
        name: pytest (full suite)
        entry: pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
