<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7a9bb5"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c9a84c"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a9a72"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="880" height="460" fill="#f8fafc" rx="12"/>

  <!-- ===== Terminal ===== -->
  <rect x="30" y="100" width="100" height="80" rx="14" fill="#d6e6f0" filter="url(#shadow)"/>
  <text x="80" y="137" text-anchor="middle" font-size="20">⌨️</text>
  <text x="80" y="160" text-anchor="middle" font-size="13" font-weight="600" fill="#2c5f7c">Terminal</text>

  <!-- Arrow: Terminal → Session -->
  <line x1="130" y1="140" x2="168" y2="140" stroke="#7a9bb5" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Agent Loop boundary ===== -->
  <rect x="165" y="28" width="370" height="280" rx="16" fill="none" stroke="#a3c4d6" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="350" y="50" text-anchor="middle" font-size="11" font-weight="600" fill="#3d7a9a" letter-spacing="1">AGENT LOOP · Strands SDK</text>

  <!-- ===== Model pills row (4 providers) ===== -->
  <rect x="178" y="58" width="58" height="16" rx="8" fill="#e8d9a0"/>
  <text x="207" y="70" text-anchor="middle" font-size="7.5" font-weight="600" fill="#6b5518">Anthropic</text>
  <rect x="240" y="58" width="58" height="16" rx="8" fill="#e8d9a0"/>
  <text x="269" y="70" text-anchor="middle" font-size="7.5" font-weight="600" fill="#6b5518">Ollama</text>
  <rect x="178" y="78" width="58" height="16" rx="8" fill="#e8d9a0"/>
  <text x="207" y="90" text-anchor="middle" font-size="7.5" font-weight="600" fill="#6b5518">OpenAI</text>
  <rect x="240" y="78" width="58" height="16" rx="8" fill="#e8d9a0"/>
  <text x="269" y="90" text-anchor="middle" font-size="7.5" font-weight="600" fill="#6b5518">LiteLLM</text>

  <!-- ===== Session ===== -->
  <rect x="178" y="105" width="120" height="80" rx="12" fill="#f5ecd0" filter="url(#shadow)"/>
  <text x="238" y="130" text-anchor="middle" font-size="13" font-weight="600" fill="#7a6420">Session</text>
  <text x="238" y="148" text-anchor="middle" font-size="9.5" fill="#9a8234">Config · Loop</text>
  <text x="238" y="162" text-anchor="middle" font-size="9" fill="#a89238">+ ObservationMaskingMgr</text>
  <text x="238" y="176" text-anchor="middle" font-size="9" fill="#a89238">+ FileSessionManager</text>

  <!-- Arrow: Session → Model pills -->
  <line x1="238" y1="105" x2="238" y2="98" stroke="#7a9bb5" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Arrow: Session → Tools -->
  <line x1="298" y1="140" x2="334" y2="140" stroke="#7a9bb5" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Tools ===== -->
  <rect x="338" y="85" width="180" height="120" rx="12" fill="#cde2ec" filter="url(#shadow)"/>
  <text x="428" y="111" text-anchor="middle" font-size="13" font-weight="600" fill="#1e4d6b">Tools</text>

  <!-- Tool pills: 3 rows -->
  <rect x="350" y="119" width="62" height="20" rx="10" fill="#b3d1e0"/>
  <text x="381" y="133" text-anchor="middle" font-size="9" font-weight="600" fill="#1e4d6b">shell</text>
  <rect x="418" y="119" width="90" height="20" rx="10" fill="#b3d1e0"/>
  <text x="463" y="133" text-anchor="middle" font-size="9" font-weight="600" fill="#1e4d6b">web_search</text>

  <rect x="350" y="145" width="90" height="20" rx="10" fill="#b3d1e0"/>
  <text x="395" y="159" text-anchor="middle" font-size="9" font-weight="600" fill="#1e4d6b">http_request</text>
  <rect x="446" y="145" width="62" height="20" rx="10" fill="#b3d1e0"/>
  <text x="477" y="159" text-anchor="middle" font-size="9" font-weight="600" fill="#1e4d6b">pdf</text>

  <rect x="397" y="171" width="62" height="20" rx="10" fill="#b3d1e0"/>
  <text x="428" y="185" text-anchor="middle" font-size="9" font-weight="600" fill="#1e4d6b">MCP</text>

  <!-- Return arrow: Tools → Session (below) with Trace Lessons label -->
  <path d="M 428 205 L 428 235 L 238 235 L 238 185" stroke="#a3c4d6" stroke-width="1.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="5 3"/>
  <rect x="284" y="243" width="108" height="20" rx="10" fill="#eee5c6"/>
  <text x="338" y="257" text-anchor="middle" font-size="9" font-weight="600" fill="#7a6420">Trace Lessons</text>

  <!-- ===== Response arrow back ===== -->
  <path d="M 178 165 L 155 165 L 155 275 L 80 275 L 80 186" stroke="#7a9bb5" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="90" y="265" width="74" height="22" rx="11" fill="#d6e6f0"/>
  <text x="127" y="281" text-anchor="middle" font-size="11" font-weight="600" fill="#2c5f7c">Response</text>

  <!-- ===== HTTP API path ===== -->

  <!-- HTTP Client box -->
  <rect x="30" y="335" width="100" height="80" rx="14" fill="#d8edd8" filter="url(#shadow)"/>
  <text x="80" y="368" text-anchor="middle" font-size="18">🌐</text>
  <text x="80" y="392" text-anchor="middle" font-size="12" font-weight="600" fill="#2a6642">HTTP Client</text>

  <!-- Arrow: HTTP Client → server.py -->
  <line x1="130" y1="375" x2="168" y2="375" stroke="#5a9a72" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- server.py box -->
  <rect x="178" y="330" width="160" height="92" rx="12" fill="#d8edd8" filter="url(#shadow)"/>
  <text x="258" y="350" text-anchor="middle" font-size="12" font-weight="600" fill="#2a6642">server.py</text>
  <text x="258" y="366" text-anchor="middle" font-size="9" fill="#3d7a54">POST /message</text>
  <text x="258" y="378" text-anchor="middle" font-size="9" fill="#3d7a54">POST /message/stream (SSE)</text>
  <text x="258" y="390" text-anchor="middle" font-size="9" fill="#3d7a54">GET /playground · /health</text>
  <text x="258" y="402" text-anchor="middle" font-size="9" fill="#3d7a54">GET /api/traces (trace ui)</text>
  <text x="258" y="414" text-anchor="middle" font-size="9" fill="#3d7a54">bearer auth · CORS · 1MB cap</text>

  <!-- Arrow: server.py up to Session -->
  <line x1="258" y1="330" x2="258" y2="188" stroke="#5a9a72" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow-green)"/>

  <!-- ===== Right: Workspace ===== -->
  <line x1="518" y1="125" x2="560" y2="125" stroke="#c9a84c" stroke-width="2" marker-end="url(#arrow-gold)"/>

  <rect x="564" y="60" width="290" height="155" rx="14" fill="#2c5f7c" filter="url(#shadow)"/>
  <text x="709" y="85" text-anchor="middle" font-size="13" font-weight="600" fill="#f0e6c8">Workspace</text>
  <text x="709" y="101" text-anchor="middle" font-size="10" fill="#a3c4d6">Sandboxed file I/O · session state</text>

  <rect x="578" y="113" width="125" height="28" rx="7" fill="#3a7291"/>
  <text x="640" y="131" text-anchor="middle" font-size="10" font-weight="500" fill="#e8f0f5">CONTEXT.md</text>
  <rect x="715" y="113" width="125" height="28" rx="7" fill="#3a7291"/>
  <text x="777" y="131" text-anchor="middle" font-size="10" font-weight="500" fill="#e8f0f5">history.jsonl</text>

  <rect x="578" y="148" width="125" height="28" rx="7" fill="#3a7291"/>
  <text x="640" y="166" text-anchor="middle" font-size="10" font-weight="500" fill="#e8f0f5">traces/*.json</text>
  <rect x="715" y="148" width="125" height="28" rx="7" fill="#3a7291"/>
  <text x="777" y="166" text-anchor="middle" font-size="10" font-weight="500" fill="#e8f0f5">sessions/&lt;id&gt;/</text>

  <text x="709" y="197" text-anchor="middle" font-size="9" fill="#a3c4d6" font-style="italic">stateful conversations via FileSessionManager</text>

  <!-- ===== Right: Observer ===== -->
  <line x1="518" y1="160" x2="560" y2="265" stroke="#c9a84c" stroke-width="2" marker-end="url(#arrow-gold)"/>

  <rect x="564" y="245" width="290" height="80" rx="14" fill="#f5ecd0" filter="url(#shadow)"/>
  <text x="709" y="271" text-anchor="middle" font-size="13" font-weight="600" fill="#7a6420">Observer</text>
  <text x="709" y="289" text-anchor="middle" font-size="10" fill="#9a8234">Rich tracing · Structured logs · Hooks</text>
  <text x="709" y="305" text-anchor="middle" font-size="9" fill="#b09a3e">trace list · graph · timeline · diff · stats · ui</text>
  <text x="709" y="318" text-anchor="middle" font-size="9" fill="#b09a3e">cost · cache tokens · per-step attribution</text>

  <!-- ===== Right: Testing ===== -->
  <line x1="518" y1="180" x2="560" y2="370" stroke="#c9a84c" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arrow-gold)"/>

  <rect x="564" y="350" width="290" height="60" rx="14" fill="#e8d9a0" filter="url(#shadow)"/>
  <text x="709" y="374" text-anchor="middle" font-size="13" font-weight="600" fill="#6b5518">Regression Testing</text>
  <text x="709" y="392" text-anchor="middle" font-size="10" fill="#7a6420">YAML specs · 11 assertions · TAP / JUnit</text>
  <text x="709" y="404" text-anchor="middle" font-size="9" fill="#9a8234">Wilson CI scoring · stub tools · keep-workspace</text>

  <!-- Bottom credit -->
  <text x="440" y="445" text-anchor="middle" font-size="9" fill="#a3c4d6">Observable Agent Runtime · Built on Strands Agents SDK · v2.2 stateful conversations</text>
</svg>
