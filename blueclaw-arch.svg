<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7a9bb5"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c9a84c"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a9a72"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8a6fb0"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="880" height="580" fill="#f8fafc" rx="12"/>

  <!-- ===== Sandbox boundary (wraps Agent Loop) ===== -->
  <rect x="155" y="15" width="390" height="305" rx="18" fill="#f3eef8" stroke="#8a6fb0" stroke-width="1.5" stroke-dasharray="2 4"/>
  <text x="350" y="32" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6b4f95" letter-spacing="1.2">SANDBOX · docker | inprocess (launcher execvp)</text>

  <!-- ===== Terminal ===== -->
  <rect x="30" y="100" width="100" height="80" rx="14" fill="#d6e6f0" filter="url(#shadow)"/>
  <text x="80" y="137" text-anchor="middle" font-size="20">⌨️</text>
  <text x="80" y="160" text-anchor="middle" font-size="13" font-weight="600" fill="#2c5f7c">Terminal</text>

  <!-- Arrow: Terminal → Session -->
  <line x1="130" y1="140" x2="168" y2="140" stroke="#7a9bb5" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Agent Loop boundary ===== -->
  <rect x="165" y="48" width="370" height="262" rx="16" fill="none" stroke="#a3c4d6" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="350" y="68" text-anchor="middle" font-size="11" font-weight="600" fill="#3d7a9a" letter-spacing="1">AGENT LOOP · Strands SDK</text>

  <!-- ===== Model pills row (4 providers) ===== -->
  <rect x="178" y="76" width="58" height="16" rx="8" fill="#e8d9a0"/>
  <text x="207" y="88" text-anchor="middle" font-size="7.5" font-weight="600" fill="#6b5518">Anthropic</text>
  <rect x="240" y="76" width="58" height="16" rx="8" fill="#e8d9a0"/>
  <text x="269" y="88" text-anchor="middle" font-size="7.5" font-weight="600" fill="#6b5518">Ollama</text>
  <rect x="178" y="96" width="58" height="16" rx="8" fill="#e8d9a0"/>
  <text x="207" y="108" text-anchor="middle" font-size="7.5" font-weight="600" fill="#6b5518">OpenAI</text>
  <rect x="240" y="96" width="58" height="16" rx="8" fill="#e8d9a0"/>
  <text x="269" y="108" text-anchor="middle" font-size="7.5" font-weight="600" fill="#6b5518">LiteLLM</text>

  <!-- ===== Session ===== -->
  <rect x="178" y="122" width="120" height="96" rx="12" fill="#f5ecd0" filter="url(#shadow)"/>
  <text x="238" y="142" text-anchor="middle" font-size="13" font-weight="600" fill="#7a6420">Session</text>
  <text x="238" y="158" text-anchor="middle" font-size="9" fill="#9a8234">SOUL + CONTEXT prompt</text>
  <text x="238" y="171" text-anchor="middle" font-size="9" fill="#a89238">ObservationMaskingMgr</text>
  <text x="238" y="184" text-anchor="middle" font-size="9" fill="#a89238">FileSessionManager</text>
  <text x="238" y="197" text-anchor="middle" font-size="9" fill="#a89238">Skills loader</text>
  <text x="238" y="210" text-anchor="middle" font-size="9" fill="#a89238">Lessons injector</text>

  <!-- Arrow: Session → Model pills -->
  <line x1="238" y1="122" x2="238" y2="116" stroke="#7a9bb5" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Arrow: Session → Tools -->
  <line x1="298" y1="158" x2="334" y2="158" stroke="#7a9bb5" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Tools ===== -->
  <rect x="338" y="100" width="180" height="138" rx="12" fill="#cde2ec" filter="url(#shadow)"/>
  <text x="428" y="124" text-anchor="middle" font-size="13" font-weight="600" fill="#1e4d6b">Tools</text>

  <!-- Tool pills -->
  <rect x="350" y="132" width="62" height="20" rx="10" fill="#b3d1e0"/>
  <text x="381" y="146" text-anchor="middle" font-size="9" font-weight="600" fill="#1e4d6b">shell</text>
  <rect x="418" y="132" width="90" height="20" rx="10" fill="#b3d1e0"/>
  <text x="463" y="146" text-anchor="middle" font-size="9" font-weight="600" fill="#1e4d6b">web_search</text>

  <rect x="350" y="158" width="90" height="20" rx="10" fill="#b3d1e0"/>
  <text x="395" y="172" text-anchor="middle" font-size="9" font-weight="600" fill="#1e4d6b">http_request</text>
  <rect x="446" y="158" width="62" height="20" rx="10" fill="#b3d1e0"/>
  <text x="477" y="172" text-anchor="middle" font-size="9" font-weight="600" fill="#1e4d6b">pdf</text>

  <rect x="350" y="184" width="62" height="20" rx="10" fill="#b3d1e0"/>
  <text x="381" y="198" text-anchor="middle" font-size="9" font-weight="600" fill="#1e4d6b">MCP</text>
  <rect x="418" y="184" width="90" height="20" rx="10" fill="#b3d1e0"/>
  <text x="463" y="198" text-anchor="middle" font-size="9" font-weight="600" fill="#1e4d6b">uploads</text>

  <rect x="382" y="210" width="92" height="20" rx="10" fill="#b3d1e0"/>
  <text x="428" y="224" text-anchor="middle" font-size="9" font-weight="600" fill="#1e4d6b">approval gate</text>

  <!-- Return arrow: Tools → Session (below) with Trace Lessons label -->
  <path d="M 428 238 L 428 262 L 238 262 L 238 218" stroke="#a3c4d6" stroke-width="1.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="5 3"/>
  <rect x="284" y="270" width="108" height="20" rx="10" fill="#eee5c6"/>
  <text x="338" y="284" text-anchor="middle" font-size="9" font-weight="600" fill="#7a6420">Trace Lessons</text>

  <!-- ===== Response arrow back ===== -->
  <path d="M 178 178 L 145 178 L 145 338 L 80 338 L 80 186" stroke="#7a9bb5" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="40" y="327" width="80" height="22" rx="11" fill="#d6e6f0"/>
  <text x="80" y="343" text-anchor="middle" font-size="11" font-weight="600" fill="#2c5f7c">Response</text>

  <!-- ===== HTTP API path ===== -->

  <!-- HTTP Client box -->
  <rect x="30" y="355" width="100" height="80" rx="14" fill="#d8edd8" filter="url(#shadow)"/>
  <text x="80" y="388" text-anchor="middle" font-size="18">🌐</text>
  <text x="80" y="412" text-anchor="middle" font-size="12" font-weight="600" fill="#2a6642">HTTP Client</text>

  <!-- Arrow: HTTP Client → server.py -->
  <line x1="130" y1="395" x2="168" y2="395" stroke="#5a9a72" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- server.py box -->
  <rect x="178" y="350" width="160" height="92" rx="12" fill="#d8edd8" filter="url(#shadow)"/>
  <text x="258" y="370" text-anchor="middle" font-size="12" font-weight="600" fill="#2a6642">server.py</text>
  <text x="258" y="386" text-anchor="middle" font-size="9" fill="#3d7a54">POST /message</text>
  <text x="258" y="398" text-anchor="middle" font-size="9" fill="#3d7a54">POST /message/stream (SSE)</text>
  <text x="258" y="410" text-anchor="middle" font-size="9" fill="#3d7a54">GET /playground · /health</text>
  <text x="258" y="422" text-anchor="middle" font-size="9" fill="#3d7a54">GET /api/traces (trace ui)</text>
  <text x="258" y="434" text-anchor="middle" font-size="9" fill="#3d7a54">bearer auth · CORS · 1MB cap</text>

  <!-- Arrow: server.py up to Session -->
  <line x1="258" y1="350" x2="258" y2="218" stroke="#5a9a72" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow-green)"/>

  <!-- ===== Right: Workspace ===== -->
  <line x1="518" y1="140" x2="560" y2="140" stroke="#c9a84c" stroke-width="2" marker-end="url(#arrow-gold)"/>

  <rect x="564" y="60" width="290" height="190" rx="14" fill="#2c5f7c" filter="url(#shadow)"/>
  <text x="709" y="85" text-anchor="middle" font-size="13" font-weight="600" fill="#f0e6c8">Workspace</text>
  <text x="709" y="101" text-anchor="middle" font-size="10" fill="#a3c4d6">Sandboxed file I/O · session state · identity</text>

  <rect x="578" y="113" width="125" height="28" rx="7" fill="#3a7291"/>
  <text x="640" y="131" text-anchor="middle" font-size="10" font-weight="500" fill="#e8f0f5">SOUL.md</text>
  <rect x="715" y="113" width="125" height="28" rx="7" fill="#3a7291"/>
  <text x="777" y="131" text-anchor="middle" font-size="10" font-weight="500" fill="#e8f0f5">CONTEXT.md</text>

  <rect x="578" y="148" width="125" height="28" rx="7" fill="#3a7291"/>
  <text x="640" y="166" text-anchor="middle" font-size="10" font-weight="500" fill="#e8f0f5">history.jsonl</text>
  <rect x="715" y="148" width="125" height="28" rx="7" fill="#3a7291"/>
  <text x="777" y="166" text-anchor="middle" font-size="10" font-weight="500" fill="#e8f0f5">traces/*.json</text>

  <rect x="578" y="183" width="125" height="28" rx="7" fill="#3a7291"/>
  <text x="640" y="201" text-anchor="middle" font-size="10" font-weight="500" fill="#e8f0f5">sessions/&lt;id&gt;/</text>
  <rect x="715" y="183" width="125" height="28" rx="7" fill="#3a7291"/>
  <text x="777" y="201" text-anchor="middle" font-size="10" font-weight="500" fill="#e8f0f5">skills/</text>

  <text x="709" y="232" text-anchor="middle" font-size="9" fill="#a3c4d6" font-style="italic">SOUL = persona · CONTEXT = facts · FileSessionManager threads</text>

  <!-- ===== Right: Observer ===== -->
  <line x1="518" y1="175" x2="560" y2="290" stroke="#c9a84c" stroke-width="2" marker-end="url(#arrow-gold)"/>

  <rect x="564" y="270" width="290" height="80" rx="14" fill="#f5ecd0" filter="url(#shadow)"/>
  <text x="709" y="296" text-anchor="middle" font-size="13" font-weight="600" fill="#7a6420">Observer</text>
  <text x="709" y="314" text-anchor="middle" font-size="10" fill="#9a8234">Rich tracing · Structured logs · Hooks</text>
  <text x="709" y="330" text-anchor="middle" font-size="9" fill="#b09a3e">trace list · graph · timeline · diff · stats · ui</text>
  <text x="709" y="343" text-anchor="middle" font-size="9" fill="#b09a3e">cost · cache tokens · sandbox.mode/image/digest</text>

  <!-- ===== Right: Testing ===== -->
  <line x1="518" y1="195" x2="560" y2="395" stroke="#c9a84c" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arrow-gold)"/>

  <rect x="564" y="375" width="290" height="60" rx="14" fill="#e8d9a0" filter="url(#shadow)"/>
  <text x="709" y="399" text-anchor="middle" font-size="13" font-weight="600" fill="#6b5518">Regression Testing</text>
  <text x="709" y="417" text-anchor="middle" font-size="10" fill="#7a6420">YAML specs · 11 assertions · TAP / JUnit</text>
  <text x="709" y="429" text-anchor="middle" font-size="9" fill="#9a8234">Wilson CI scoring · stub tools · keep-workspace</text>

  <!-- ===== Telegram bridge path ===== -->

  <!-- Telegram client box -->
  <rect x="30" y="455" width="100" height="80" rx="14" fill="#f0e0ec" filter="url(#shadow)"/>
  <text x="80" y="488" text-anchor="middle" font-size="18">📱</text>
  <text x="80" y="512" text-anchor="middle" font-size="12" font-weight="600" fill="#6b4f80">Telegram</text>

  <!-- Arrow: Telegram → bridges -->
  <line x1="130" y1="495" x2="168" y2="495" stroke="#8a6fb0" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <!-- bridges/ box -->
  <rect x="178" y="450" width="160" height="92" rx="12" fill="#f0e0ec" filter="url(#shadow)"/>
  <text x="258" y="470" text-anchor="middle" font-size="12" font-weight="600" fill="#6b4f80">bridges/</text>
  <text x="258" y="486" text-anchor="middle" font-size="9" fill="#7d5e94">Allowlist · ChatContext</text>
  <text x="258" y="498" text-anchor="middle" font-size="9" fill="#7d5e94">BridgeRouter (Strands FSM)</text>
  <text x="258" y="510" text-anchor="middle" font-size="9" fill="#7d5e94">telegram.py (PTB v22)</text>
  <text x="258" y="522" text-anchor="middle" font-size="9" fill="#7d5e94">per-chat workspace</text>
  <text x="258" y="534" text-anchor="middle" font-size="9" fill="#7d5e94">~/blueclaw/chats/&lt;id&gt;/</text>

  <!-- Arrow: bridges → Session (re-uses create_agent + FileSessionManager)
       Routed around server.py on the left so it actually terminates on
       the Session box, not on Tools. -->
  <path d="M 178 470 L 148 470 L 148 170 L 178 170" stroke="#8a6fb0" stroke-width="1.5" stroke-dasharray="5 3" fill="none" marker-end="url(#arrow-purple)"/>

  <!-- ===== Sandbox CLI badge ===== -->
  <line x1="350" y1="320" x2="350" y2="350" stroke="#8a6fb0" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow-purple)"/>
  <rect x="490" y="455" width="210" height="22" rx="11" fill="#e6dcf0" stroke="#8a6fb0" stroke-width="1"/>
  <text x="595" y="471" text-anchor="middle" font-size="10" font-weight="600" fill="#6b4f95">blueclaw sandbox · build / doctor</text>

  <!-- Bottom credit -->
  <text x="440" y="565" text-anchor="middle" font-size="9" fill="#a3c4d6">Observable Agent Runtime · Built on Strands Agents SDK · v2.6 + Telegram bridge + multi-workspace traces</text>
</svg>
