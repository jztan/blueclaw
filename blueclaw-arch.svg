<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="s" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.10"/>
    </filter>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7a9bb5"/>
    </marker>
    <marker id="a-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c9a84c"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="420" fill="#f8fafc" rx="12"/>

  <!-- Title -->
  <text x="360" y="30" text-anchor="middle" font-size="14" font-weight="600" fill="#2c5f7c">BlueClaw — architecture</text>

  <!-- BlueClaw system boundary (wraps runner + agent + observer + workspace) -->
  <rect x="195" y="45" width="515" height="320" rx="14" fill="none" stroke="#2c5f7c" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="205" y="60" text-anchor="start" font-size="10.5" font-weight="700" fill="#2c5f7c" letter-spacing="1.5">BLUECLAW</text>

  <!-- ===== Adapters (left column) ===== -->
  <rect x="30" y="60" width="110" height="60" rx="12" fill="#d6e6f0" filter="url(#s)"/>
  <text x="85" y="85" text-anchor="middle" font-size="16">⌨️</text>
  <text x="85" y="106" text-anchor="middle" font-size="11" font-weight="600" fill="#2c5f7c">Terminal</text>

  <rect x="30" y="140" width="110" height="60" rx="12" fill="#d8edd8" filter="url(#s)"/>
  <text x="85" y="165" text-anchor="middle" font-size="16">🌐</text>
  <text x="85" y="186" text-anchor="middle" font-size="11" font-weight="600" fill="#2a6642">HTTP</text>
  <text x="85" y="200" text-anchor="middle" font-size="8" fill="#3d7a54">/message · /stream</text>

  <rect x="30" y="220" width="110" height="60" rx="12" fill="#fce4dc" filter="url(#s)"/>
  <text x="85" y="245" text-anchor="middle" font-size="16">📱</text>
  <text x="85" y="266" text-anchor="middle" font-size="11" font-weight="600" fill="#8a4226">Telegram</text>

  <!-- Eval (smaller, distinct) -->
  <rect x="30" y="320" width="110" height="40" rx="12" fill="#e8d9a0" filter="url(#s)"/>
  <text x="85" y="338" text-anchor="middle" font-size="11" font-weight="600" fill="#6b5518">Eval (testing)</text>
  <text x="85" y="352" text-anchor="middle" font-size="8" fill="#9a7a18">YAML specs</text>

  <!-- Adapter → Runner arrows -->
  <line x1="140" y1="90" x2="218" y2="180" stroke="#7a9bb5" stroke-width="2" marker-end="url(#a)"/>
  <line x1="140" y1="170" x2="218" y2="195" stroke="#7a9bb5" stroke-width="2" marker-end="url(#a)"/>
  <line x1="140" y1="250" x2="218" y2="210" stroke="#7a9bb5" stroke-width="2" marker-end="url(#a)"/>
  <line x1="140" y1="340" x2="218" y2="225" stroke="#7a9bb5" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#a)"/>

  <!-- ===== Runner (central hub) ===== -->
  <rect x="220" y="160" width="160" height="100" rx="12" fill="#f5ecd0" stroke="#c9a84c" stroke-width="1.5" filter="url(#s)"/>
  <text x="300" y="183" text-anchor="middle" font-size="12" font-weight="700" fill="#7a6420">runner.py</text>
  <text x="300" y="200" text-anchor="middle" font-size="9" fill="#9a8234">runner_session · run_turn</text>
  <text x="300" y="214" text-anchor="middle" font-size="9" fill="#9a8234">finalize · finalize_error</text>
  <text x="300" y="232" text-anchor="middle" font-size="9" fill="#a89238">next_capture_path</text>
  <text x="300" y="246" text-anchor="middle" font-size="9" fill="#a89238">validate_session_id</text>
  <text x="300" y="258" text-anchor="middle" font-size="8" fill="#b09a3e" font-style="italic">owns MCP cleanup + capture</text>

  <!-- Runner → Strands Agent -->
  <line x1="380" y1="210" x2="430" y2="210" stroke="#7a9bb5" stroke-width="2" marker-end="url(#a)"/>
  <text x="405" y="203" text-anchor="middle" font-size="8" font-weight="600" fill="#3d7a9a">create_agent</text>

  <!-- ===== Strands Agent (the loop, collapsed) ===== -->
  <rect x="432" y="160" width="140" height="100" rx="12" fill="#cde2ec" stroke="#a3c4d6" stroke-width="1.5" stroke-dasharray="5 3" filter="url(#s)"/>
  <text x="502" y="183" text-anchor="middle" font-size="11" font-weight="700" fill="#1e4d6b">Strands Agent</text>
  <text x="502" y="198" text-anchor="middle" font-size="8" fill="#3d7a9a">model + tools loop</text>
  <text x="502" y="216" text-anchor="middle" font-size="9" fill="#1e4d6b">Anthropic · Ollama</text>
  <text x="502" y="228" text-anchor="middle" font-size="9" fill="#1e4d6b">OpenAI · LiteLLM</text>
  <text x="502" y="246" text-anchor="middle" font-size="9" fill="#1e4d6b">shell · web · pdf · MCP</text>
  <text x="502" y="258" text-anchor="middle" font-size="8" fill="#3d7a9a" font-style="italic">approval gate · sandbox</text>

  <!-- ===== Workspace ===== -->
  <rect x="585" y="60" width="115" height="170" rx="12" fill="#2c5f7c" filter="url(#s)"/>
  <text x="642" y="80" text-anchor="middle" font-size="11" font-weight="700" fill="#f0e6c8">Workspace</text>
  <text x="642" y="93" text-anchor="middle" font-size="8" fill="#a3c4d6">per-source root</text>

  <rect x="595" y="103" width="95" height="20" rx="5" fill="#3a7291"/>
  <text x="642" y="117" text-anchor="middle" font-size="8.5" fill="#e8f0f5">CONTEXT.md</text>
  <rect x="595" y="127" width="95" height="20" rx="5" fill="#3a7291"/>
  <text x="642" y="141" text-anchor="middle" font-size="8.5" fill="#e8f0f5">history.jsonl</text>
  <rect x="595" y="151" width="95" height="20" rx="5" fill="#3a7291"/>
  <text x="642" y="165" text-anchor="middle" font-size="8.5" fill="#e8f0f5">traces/*.json</text>
  <rect x="595" y="175" width="95" height="20" rx="5" fill="#3a7291"/>
  <text x="642" y="189" text-anchor="middle" font-size="8.5" fill="#e8f0f5">turns/&lt;id&gt;/turn-N/</text>
  <rect x="595" y="199" width="95" height="20" rx="5" fill="#3a7291"/>
  <text x="642" y="213" text-anchor="middle" font-size="8.5" fill="#e8f0f5">sessions/&lt;id&gt;/</text>

  <!-- Runner → Workspace (capture writes) -->
  <path d="M 380 185 L 500 130 L 585 130" stroke="#c9a84c" stroke-width="1.5" fill="none" marker-end="url(#a-gold)"/>
  <text x="500" y="123" text-anchor="middle" font-size="8" font-weight="600" fill="#c9a84c">capture · trace · history</text>

  <!-- ===== Observer ===== -->
  <rect x="432" y="280" width="140" height="60" rx="12" fill="#eee5c6" filter="url(#s)"/>
  <text x="502" y="300" text-anchor="middle" font-size="11" font-weight="600" fill="#7a6420">Observer (hooks)</text>
  <text x="502" y="315" text-anchor="middle" font-size="8" fill="#9a8234">tool calls · tokens · cost</text>
  <text x="502" y="328" text-anchor="middle" font-size="8" fill="#9a8234">feeds traces + history</text>

  <!-- Strands Agent → Observer -->
  <line x1="502" y1="260" x2="502" y2="278" stroke="#7a9bb5" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>

  <!-- ===== Per-turn capture annotation ===== -->
  <rect x="220" y="295" width="160" height="55" rx="10" fill="#fff" stroke="#c9a84c" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="300" y="312" text-anchor="middle" font-size="9" font-weight="700" fill="#7a6420">per-turn capture</text>
  <text x="300" y="326" text-anchor="middle" font-size="8" fill="#9a8234">terminal: YYYYMMDD-HHMMSS-xxxx</text>
  <text x="300" y="338" text-anchor="middle" font-size="8" fill="#9a8234">HTTP: conversation_id</text>
  <text x="300" y="348" text-anchor="middle" font-size="8" fill="#9a8234">Telegram: chat_id</text>

  <!-- Bottom credit -->
  <text x="360" y="395" text-anchor="middle" font-size="9" fill="#a3c4d6">Three adapters · one runner · one agent loop · sandboxed workspace · per-turn capture across all surfaces</text>
</svg>
