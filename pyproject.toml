[project]
name = "blueclaw"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "strands-agents>=1.28.0",
    "strands-agents-tools",
    "pdf-mcp>=1.3",
    "typer>=0.9",
    "rich>=13",
    "prompt-toolkit>=3",
    "pydantic>=2",
    "pyyaml>=6",
]

[project.scripts]
blueclaw = "blueclaw.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-mock"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
