[project]
name = "blueclaw"
version = "1.1.0"
requires-python = ">=3.11"
dependencies = [
    "strands-agents>=1.28.0",
    "strands-agents-tools",
    "pdf-mcp @ git+https://github.com/jztan/pdf-mcp@develop",
    "typer>=0.9",
    "rich>=13",
    "prompt-toolkit>=3",
    "pydantic>=2",
    "pyyaml>=6",
]

[project.scripts]
blueclaw = "blueclaw.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-mock", "flake8>=7", "black>=24"]

[tool.setuptools.packages.find]
include = ["blueclaw*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88
