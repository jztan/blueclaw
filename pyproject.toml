[project]
name = "blueclaw"
version = "2.1.0"
description = "Terminal AI agent with built-in execution tracing and observability"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Kevin Tan"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Shells",
]
dependencies = [
    "strands-agents>=1.28.0",
    "strands-agents-tools",
    "pdf-mcp>=1.10.0",
    "typer>=0.9",
    "rich>=13",
    "prompt-toolkit>=3",
    "pydantic>=2",
    "pyyaml>=6",
    "ddgs>=9",
    "starlette>=0.46",
    "uvicorn>=0.31",
]

[project.urls]
Homepage = "https://github.com/jztan/blueclaw"
Repository = "https://github.com/jztan/blueclaw"
Issues = "https://github.com/jztan/blueclaw/issues"

[project.scripts]
blueclaw = "blueclaw.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-mock", "flake8>=7", "black>=24", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["blueclaw*"]

[tool.setuptools.package-data]
blueclaw = ["static/*.html", "static/*.png"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
filterwarnings = ["ignore::pytest.PytestCollectionWarning"]

[tool.black]
line-length = 88
